name: Deploy production

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ragbaz-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GRAPHQL_SYNC_KEY: ${{ secrets.GRAPHQL_SYNC_KEY }}
      RAGBAZ_DOCS_ROOT: ${{ github.workspace }}/doc.ragbaz.cc
      RAGBAZ_USE_COMMITTED_WORKSPACE_INDEX: "1"
    steps:
      - name: Check deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository secret"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: ragbaz.cc

      - name: Check out public documentation
        uses: actions/checkout@v4
        with:
          repository: tabenius/doc.ragbaz
          path: doc.ragbaz.cc

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ragbaz.cc/package-lock.json

      - name: Install dependencies
        working-directory: ragbaz.cc
        run: npm ci

      - name: Build and deploy
        working-directory: ragbaz.cc
        run: npm run deploy
