# Local development — runs the OpenNext Worker in a workerd preview container.
# Production deploys to the Cloudflare edge via `npm run deploy`.
services:
  ragbaz-cc:
    build: .
    image: ragbaz-cc:local
    container_name: ragbaz-cc
    restart: unless-stopped
    env_file:
      - .env.staging.local
    ports:
      - "127.0.0.1:8820:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - ragbaz-cc-wrangler-state:/app/.wrangler/state
    networks:
      - traefik-public

volumes:
  ragbaz-cc-wrangler-state:

networks:
  traefik-public:
    name: traefik-public
    external: true
