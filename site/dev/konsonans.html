<script>

  var stage=document.getElementById('stage'),vp=document.getElementById('viewport'),svg=vp.querySelector('svg');
  var scale=1,tx=0,ty=0,drag=null;

  function size(){var w=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.width)||svg.getBoundingClientRect().width||2092;var h=(svg.viewBox&&svg.viewBox.baseVal&&svg.viewBox.baseVal.height)||svg.getBoundingClientRect().height||1356;return {w:w,h:h};}
